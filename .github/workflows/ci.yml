name: CI

on:
  pull_request:
  push:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install ruff
      - run: ruff check convert.py

  fhir-validate:
    name: FHIR Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache FHIR validator
        uses: actions/cache@v4
        with:
          path: |
            validator_cli.jar
            ~/.fhir
          key: fhir-validator-${{ runner.os }}
      - name: Download FHIR validator
        run: |
          if [ ! -f validator_cli.jar ]; then
            curl -L -o validator_cli.jar \
              https://github.com/hapifhir/org.hl7.fhir.core/releases/latest/download/validator_cli.jar
          fi
      - name: Run converter against test fixtures
        run: |
          # To add new test fixtures, place a CSV in input/ with the *.BedCapacity.csv naming convention.
          # Files matching *column-labels-only* are excluded (headers only, no data rows).
          for csv in input/*.BedCapacity.csv; do
            case "$csv" in
              *column-labels-only*) continue ;;
            esac
            echo "Converting: $csv"
            python3 convert.py "$csv" --config config.example.json --output-dir output
          done
      - name: Extract SAFR IG version
        id: ig-version
        run: |
          SAFR_IG_VERSION=$(grep -oP '^SAFR_IG_VERSION\s*=\s*"\K[^"]+' convert.py)
          NHSN_SAFR_IG_VERSION=$(grep -oP 'NHSN_SAFR_IG_VERSION\s*=\s*"\K[^"]+' convert.py)
          echo "SAFR_IG_VERSION=$SAFR_IG_VERSION" >> "$GITHUB_ENV"
          echo "NHSN_SAFR_IG_VERSION=$NHSN_SAFR_IG_VERSION" >> "$GITHUB_ENV"
      - name: Log IG version
        run: echo "Validating against SAFR IG version: $SAFR_IG_VERSION, NHSN SAFR Content IG version: $NHSN_SAFR_IG_VERSION"
      - name: Validate FHIR Bundles
        run: |
          # Known upstream errors are documented in known-validation-issues.md.
          # We filter those and fail only on errors introduced by this project.
          set +e
          VALIDATOR_OUTPUT=$(java -jar validator_cli.jar output/**/*.json \
            -version 4.0.1 \
            -ig hl7.fhir.us.safr#$SAFR_IG_VERSION \
            -ig https://safr-ci.nhsnlink.org/package.tgz 2>&1)
          VALIDATOR_EXIT=$?
          set -e

          echo "$VALIDATOR_OUTPUT"

          if [ $VALIDATOR_EXIT -ne 0 ]; then
            # Strip ANSI codes, extract Error lines, exclude known upstream issues
            # (see known-validation-issues.md for details and root-cause analysis)
            REAL_ERRORS=$(echo "$VALIDATOR_OUTPUT" \
              | sed 's/\x1b\[[0-9;]*m//g' \
              | grep '  Error @' \
              | grep -v 'extension-MeasureReport.supplementalData' \
              | grep -v "Slice 'Bundle.entry:measurereport': a matching slice is required" \
              || true)

            if [ -n "$REAL_ERRORS" ]; then
              echo ""
              echo "::error::FHIR validation (SAFR IG $SAFR_IG_VERSION, NHSN SAFR Content IG $NHSN_SAFR_IG_VERSION) found errors beyond known upstream issues (see known-validation-issues.md):"
              echo "$REAL_ERRORS"
              exit 1
            else
              echo ""
              echo "::warning::FHIR validation (SAFR IG $SAFR_IG_VERSION, NHSN SAFR Content IG $NHSN_SAFR_IG_VERSION) reported only known upstream errors (see known-validation-issues.md). These affect the IG's own published examples and are not caused by this project."
            fi
          fi

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m unittest discover -s tests -p "test_*.py"

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
