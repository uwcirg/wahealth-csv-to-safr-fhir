name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install ruff
      - run: ruff check convert.py

  fhir-validate:
    name: FHIR Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache FHIR validator
        uses: actions/cache@v4
        with:
          path: |
            validator_cli.jar
            ~/.fhir
          key: fhir-validator-${{ runner.os }}
      - name: Download FHIR validator
        run: |
          if [ ! -f validator_cli.jar ]; then
            curl -L -o validator_cli.jar \
              https://github.com/hapifhir/org.hl7.fhir.core/releases/latest/download/validator_cli.jar
          fi
      - name: Run converter against test fixtures
        run: |
          # To add new test fixtures, place a CSV in input/ with the *.BedCapacity.csv naming convention.
          # Files matching *column-labels-only* are excluded (headers only, no data rows).
          for csv in input/*.BedCapacity.csv; do
            case "$csv" in
              *column-labels-only*) continue ;;
            esac
            echo "Converting: $csv"
            python3 convert.py "$csv" --config config.example.json --output-dir output
          done
      - name: Extract SAFR IG version
        id: ig-version
        run: |
          SAFR_IG_VERSION=$(python3 -c "import re; m=re.search(r\"SAFR_IG_VERSION\s*=\s*['\"]([^'\"]+)['\"]\", open('convert.py').read()); print(m.group(1))")
          echo "SAFR_IG_VERSION=$SAFR_IG_VERSION" >> "$GITHUB_ENV"
      - name: Log IG version
        run: echo "Validating against SAFR IG version:$SAFR_IG_VERSION"
      - name: Validate FHIR Bundles
        run: |
          java -jar validator_cli.jar output/**/*.json \
            -version 4.0.1 \
            -ig hl7.fhir.us.safr#$SAFR_IG_VERSION

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
